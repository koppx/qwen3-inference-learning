<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1080" viewBox="0 0 920 1080" role="img" aria-labelledby="title desc">
<title id="title">先跟住一轮生成：输入、计算、选词、继续或停止</title>
<desc id="desc">教学主线。聊天模板和分词器准备输入，一次模型forward包含Embedding、规则与位置数据准备、Decoder层和输出头，返回候选分数。generate选择一个ID，检查停止条件。未结束则把刚选的ID作为下一轮输入；结束后解码新ID为文字。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#465669" stroke-width="1.6"/></marker></defs>
<rect width="920" height="1080" fill="#f8fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#213348">
<text x="40" y="49" font-size="29" font-weight="700">第一次阅读，先跟住这一轮</text>
<text x="40" y="81" font-size="18" fill="#586a7e">教学主线 · 不必先背类名、维度和参数 · 向下读，未结束就沿右侧返回</text>
<rect x="70" y="107" width="710" height="89" rx="12" fill="#e9f2fd" stroke="#98b9dd"/>
<text x="94" y="143" font-size="23" font-weight="700">准备输入：文字 → token ID</text>
<text x="94" y="176" font-size="19">“1加1等于几？”＋聊天模板 → 18 个 ID（位置 0～17）</text>
<path d="M425 197V228" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="232" width="755" height="395" rx="16" fill="#edf8f4" stroke="#198477" stroke-width="2"/>
<text x="70" y="269" font-size="24" font-weight="700" fill="#176b61">一次 forward：只负责算出候选分数</text>
<rect x="90" y="293" width="665" height="60" rx="9" fill="#fff" stroke="#9acdbf"/>
<text x="110" y="330" font-size="21">Embedding：用 ID 查出学到的特征向量</text>
<path d="M425 354V374" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<rect x="90" y="378" width="665" height="60" rx="9" fill="#fff" stroke="#9acdbf"/>
<text x="110" y="415" font-size="21">准备规则：哪些位置能读、位置如何参与计算</text>
<path d="M425 439V459" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<rect x="90" y="463" width="665" height="60" rx="9" fill="#fff" stroke="#9acdbf"/>
<text x="110" y="500" font-size="21">Decoder 各层：读取上下文，再加工当前特征</text>
<path d="M425 524V544" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<rect x="90" y="548" width="665" height="60" rx="9" fill="#fff" stroke="#9acdbf"/>
<text x="110" y="585" font-size="21">最终归一化＋输出头：向量 → 下一 token 的分数</text>
<path d="M425 628V655" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<rect x="70" y="660" width="710" height="96" rx="12" fill="#fff5e6" stroke="#d5a65b"/>
<text x="94" y="695" font-size="23" font-weight="700">回到 generate()：选一个 ID，追加到序列</text>
<text x="94" y="729" font-size="19">本次先选 ID 16 → “1”；这是“1加1等于2”的开头。</text>
<path d="M425 757V782" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<rect x="220" y="787" width="405" height="70" rx="12" fill="#fff5e6" stroke="#d5a65b"/>
<text x="422" y="816" font-size="22" font-weight="700" text-anchor="middle">检查：该结束了吗？</text>
<text x="422" y="842" font-size="17" text-anchor="middle">选到结束标记，或达到长度上限</text>
<path d="M626 822H850V213H425V228" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<text x="643" y="799" font-size="18" font-weight="700">未结束</text>
<rect x="813" y="365" width="74" height="275" rx="9" fill="#f8fafc"/>
<text x="842" y="391" font-size="18" text-anchor="middle">下一轮</text>
<text x="842" y="427" font-size="18" text-anchor="middle">新 ID</text>
<text x="842" y="454" font-size="18" text-anchor="middle">＋</text>
<text x="842" y="481" font-size="18" text-anchor="middle">历史</text>
<text x="842" y="508" font-size="18" text-anchor="middle">缓存</text>
<text x="842" y="554" font-size="18" text-anchor="middle">重走</text>
<text x="842" y="581" font-size="18" text-anchor="middle">同一</text>
<text x="842" y="608" font-size="18" text-anchor="middle">网络</text>
<path d="M425 858V899" fill="none" stroke="#465669" stroke-width="2" marker-end="url(#a)"/>
<text x="444" y="886" font-size="18">已结束</text>
<rect x="70" y="903" width="710" height="80" rx="12" fill="#e9f2fd" stroke="#98b9dd"/>
<text x="94" y="936" font-size="23" font-weight="700">显示结果：只取新增 ID，再还原成文字</text>
<text x="94" y="966" font-size="18">tokenizer.decode() 是编号转文字，不再运行网络计算。</text>
<text x="45" y="1020" font-size="18" fill="#586a7e">Prefill：第一次处理整段输入。Decode：后续带缓存继续生成。</text>
<text x="45" y="1051" font-size="18" fill="#586a7e">两种阶段都做 Embedding 和 Decoder 层；刚选出的 ID 下一轮才计算自己的 K/V。</text>
</g>
</svg>
