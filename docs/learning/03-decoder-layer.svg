<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
  <title id="title">一层 Decoder 的两次加工与两条残差连接</title>
  <desc id="desc">输入先归一化并经过注意力，与原输入相加；再归一化并经过MLP，与本段输入相加。每步层间表示都保持1024维。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#495057" stroke-width="1.5"/></marker></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#212529;font-size:16px;letter-spacing:0}
    .title{font-size:22px;font-weight:600}.small{font-size:14px;fill:#495057}.edge{fill:none;stroke:#495057;stroke-width:1.5;marker-end:url(#arrow)}
    .sky{fill:#1864ab}.mint{fill:#087f5b}
  </style>
  <rect width="680" height="700" rx="8" fill="#fff"/>
  <text class="title" x="40" y="40">每层先读上下文，再加工自己的特征</text>
  <text class="small" x="40" y="66">蓝色：Attention 子层　绿色：MLP 子层　左侧：保留原表示</text>
  <text x="360" y="104" text-anchor="middle">输入 x：[B, S, 1024]</text>
  <path class="edge" d="M360 116V143"/>
  <path class="edge" d="M360 127H130V325H341"/>
  <text class="small" x="56" y="221">原样保留 x</text>
  <rect x="220" y="143" width="280" height="48" rx="5" fill="#e7f5ff" stroke="#339af0"/>
  <text class="sky" x="360" y="173" text-anchor="middle">RMSNorm：稳定数字尺度</text>
  <path class="edge" d="M360 191V220"/>
  <rect x="220" y="220" width="280" height="58" rx="5" fill="#e7f5ff" stroke="#339af0"/>
  <text class="sky" x="360" y="244" text-anchor="middle">Attention：读取上下文</text>
  <text class="small" x="360" y="266" text-anchor="middle">输出仍为 [B, S, 1024]</text>
  <path class="edge" d="M360 278V306"/>
  <circle cx="360" cy="325" r="19" fill="#fff" stroke="#495057"/>
  <text x="360" y="331" text-anchor="middle">+</text>
  <text class="small" x="400" y="331">u = x + Attention 的结果</text>
  <path class="edge" d="M360 344V395"/>
  <path class="edge" d="M360 367H130V578H341"/>
  <text class="small" x="56" y="477">原样保留 u</text>
  <rect x="220" y="395" width="280" height="48" rx="5" fill="#e6fcf5" stroke="#20c997"/>
  <text class="mint" x="360" y="425" text-anchor="middle">RMSNorm：再次稳定尺度</text>
  <path class="edge" d="M360 443V473"/>
  <rect x="220" y="473" width="280" height="58" rx="5" fill="#e6fcf5" stroke="#20c997"/>
  <text class="mint" x="360" y="497" text-anchor="middle">MLP：加工每个 token 的特征</text>
  <text class="small" x="360" y="519" text-anchor="middle">输出仍为 [B, S, 1024]</text>
  <path class="edge" d="M360 531V559"/>
  <circle cx="360" cy="578" r="19" fill="#fff" stroke="#495057"/>
  <text x="360" y="584" text-anchor="middle">+</text>
  <text class="small" x="400" y="584">y = u + MLP 的结果</text>
  <path class="edge" d="M360 597V632"/>
  <text x="360" y="659" text-anchor="middle">输出 y：[B, S, 1024]，交给下一层</text>
</svg>
