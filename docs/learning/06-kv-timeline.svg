<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache 随生成轮次增长的时间线</title>
  <desc id="desc">首轮输入18个prompt token建立18个位置的缓存并输出1。第二轮输入1，缓存增长到19并输出加。第三轮输入加，缓存增长到20并输出1。最后输出序列34个token，但缓存仅覆盖33个。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#495057" stroke-width="1.5"/></marker></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#212529;font-size:16px;letter-spacing:0}
    .title{font-size:22px;font-weight:600}.small{font-size:14px;fill:#495057}.edge{fill:none;stroke:#495057;stroke-width:1.5;marker-end:url(#arrow)}
    .sky{fill:#1864ab}.mint{fill:#087f5b}
  </style>
  <rect width="680" height="640" rx="8" fill="#fff"/>
  <text class="title" x="40" y="40">输出刚产生时，还没有它的 K/V</text>
  <text class="small" x="40" y="66">蓝色：复用旧缓存　绿色：本轮新写入　块宽仅示意，不表示比例</text>
  <text x="120" y="110" text-anchor="middle">本轮实际输入</text>
  <text x="370" y="110" text-anchor="middle">forward 后的每层缓存</text>
  <text x="590" y="110" text-anchor="middle">本轮输出</text>
  <rect x="40" y="140" width="160" height="65" rx="5" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="120" y="167" text-anchor="middle">18 个 prompt</text>
  <text class="small" x="120" y="190" text-anchor="middle">第 1 轮：Prefill</text>
  <path class="edge" d="M200 173H250"/>
  <rect x="260" y="140" width="220" height="65" rx="5" fill="#c3fae8" stroke="#20c997"/>
  <text class="mint" x="370" y="167" text-anchor="middle">新写入 18 个位置</text>
  <text class="small" x="370" y="190" text-anchor="middle">缓存长度 18</text>
  <path class="edge" d="M480 173H530"/>
  <rect x="540" y="140" width="100" height="65" rx="5" fill="#fff" stroke="#adb5bd"/>
  <text x="590" y="167" text-anchor="middle">“1”</text>
  <text class="small" x="590" y="190" text-anchor="middle">ID 16</text>
  <rect x="40" y="260" width="160" height="65" rx="5" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="120" y="287" text-anchor="middle">“1”：1 个 token</text>
  <text class="small" x="120" y="310" text-anchor="middle">第 2 轮：Decode</text>
  <path class="edge" d="M200 293H250"/>
  <rect x="260" y="260" width="165" height="65" rx="5" fill="#d0ebff" stroke="#339af0"/>
  <rect x="435" y="260" width="45" height="65" rx="5" fill="#c3fae8" stroke="#20c997"/>
  <text class="sky" x="342" y="287" text-anchor="middle">复用旧的 18 个</text>
  <text class="small" x="342" y="310" text-anchor="middle">总长度 19</text>
  <text class="mint" x="457" y="298" text-anchor="middle">+1</text>
  <path class="edge" d="M480 293H530"/>
  <rect x="540" y="260" width="100" height="65" rx="5" fill="#fff" stroke="#adb5bd"/>
  <text x="590" y="287" text-anchor="middle">“加”</text>
  <text class="small" x="590" y="310" text-anchor="middle">ID 20929</text>
  <rect x="40" y="380" width="160" height="65" rx="5" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="120" y="407" text-anchor="middle">“加”：1 个 token</text>
  <text class="small" x="120" y="430" text-anchor="middle">第 3 轮：Decode</text>
  <path class="edge" d="M200 413H250"/>
  <rect x="260" y="380" width="165" height="65" rx="5" fill="#d0ebff" stroke="#339af0"/>
  <rect x="435" y="380" width="45" height="65" rx="5" fill="#c3fae8" stroke="#20c997"/>
  <text class="sky" x="342" y="407" text-anchor="middle">复用旧的 19 个</text>
  <text class="small" x="342" y="430" text-anchor="middle">总长度 20</text>
  <text class="mint" x="457" y="418" text-anchor="middle">+1</text>
  <path class="edge" d="M480 413H530"/>
  <rect x="540" y="380" width="100" height="65" rx="5" fill="#fff" stroke="#adb5bd"/>
  <text x="590" y="407" text-anchor="middle">“1”</text>
  <text class="small" x="590" y="430" text-anchor="middle">ID 16</text>
  <text class="small" x="40" y="237">上一轮输出“1”，成为这一轮输入</text>
  <text class="small" x="40" y="357">上一轮输出“加”，成为这一轮输入</text>
  <path d="M40 480H640" stroke="#dee2e6"/>
  <text x="40" y="515">本例停止时：完整输出 34 个位置，缓存只有 33 个</text>
  <rect x="40" y="538" width="435" height="44" rx="4" fill="#d0ebff" stroke="#339af0"/>
  <rect x="490" y="538" width="150" height="44" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text class="sky" x="258" y="566" text-anchor="middle">18 个 prompt + 前 15 个输出：已缓存</text>
  <text class="small" x="565" y="566" text-anchor="middle">第 16 个输出：未缓存</text>
  <text class="small" x="40" y="613">这是正常状态：最后一个输出没有再作为输入执行下一轮 forward。</text>
</svg>
