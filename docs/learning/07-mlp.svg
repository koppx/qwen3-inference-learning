<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU MLP：两条分支相乘，再投影回1024维</title>
  <desc id="desc">同一输入分别通过gate_proj和up_proj升维，gate分支经过SiLU后与up分支逐元素相乘，最后由down_proj降回1024维。这里没有跨token的混合。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#495057" stroke-width="1.5"/></marker></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#212529;font-size:16px;letter-spacing:0}
    .title{font-size:22px;font-weight:600}.small{font-size:14px;fill:#495057}.edge{fill:none;stroke:#495057;stroke-width:1.5;marker-end:url(#arrow)}
    .sky{fill:#1864ab}.mint{fill:#087f5b}
  </style>
  <rect width="680" height="600" rx="8" fill="#fff"/>
  <text class="title" x="40" y="40">MLP：一条分支调节另一条分支</text>
  <text class="small" x="40" y="66">蓝色：生成特征　绿色：产生调节量　所有操作逐 token 进行</text>
  <rect x="190" y="90" width="300" height="50" rx="6" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="340" y="121" text-anchor="middle">输入 x：[B, S, 1024]</text>
  <path class="edge" d="M340 140V165H170V200"/>
  <path class="edge" d="M340 165H510V200"/>
  <rect x="40" y="200" width="260" height="60" rx="6" fill="#e6fcf5" stroke="#20c997"/>
  <text class="mint" x="170" y="225" text-anchor="middle">gate_proj</text>
  <text class="small" x="170" y="248" text-anchor="middle">1024 维展开成 3072 维</text>
  <rect x="380" y="200" width="260" height="60" rx="6" fill="#e7f5ff" stroke="#339af0"/>
  <text class="sky" x="510" y="225" text-anchor="middle">up_proj</text>
  <text class="small" x="510" y="248" text-anchor="middle">1024 维展开成 3072 维</text>
  <path class="edge" d="M170 260V290"/>
  <rect x="40" y="290" width="260" height="50" rx="6" fill="#e6fcf5" stroke="#20c997"/>
  <text class="mint" x="170" y="321" text-anchor="middle">SiLU：非线性变换</text>
  <path class="edge" d="M170 340V390H321"/>
  <path class="edge" d="M510 260V390H359"/>
  <circle cx="340" cy="390" r="19" fill="#fff" stroke="#495057"/>
  <text x="340" y="396" text-anchor="middle">×</text>
  <text class="small" x="385" y="423">逐元素相乘，不是矩阵乘法</text>
  <path class="edge" d="M340 409V455"/>
  <rect x="190" y="455" width="300" height="65" rx="6" fill="#e7f5ff" stroke="#339af0"/>
  <text class="sky" x="340" y="481" text-anchor="middle">down_proj</text>
  <text class="small" x="340" y="506" text-anchor="middle">3072 维压回 1024 维</text>
  <text class="small" x="40" y="560">输出 [B, S, 1024]：随后在 Decoder 层中与原表示做残差相加。</text>
  <text class="small" x="40" y="584">gate 是连续数值调节，不是开关，也不是 MoE 专家选择。</text>
</svg>
